[package]
name = "atlas-desktop"
version = "0.1.0"
description = "Atlas — a local-first desktop assistant"
authors = ["Atlas"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 2 builds the app as a library so the same entry point serves desktop
# and (later) mobile targets.
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
walkdir = "2"
# Opening happens in Rust, behind the validated commands in platform.rs, rather
# than through a JS-facing plugin the renderer could call with any target.
open = "5"
# files.delete sends to the OS recycle bin rather than calling fs::remove_*
# directly — meaningfully safer for a confirm-gated destructive action.
trash = "3"
# web_search / fetch_page (web.rs), ask_claude / ask_openai (intelligence.rs).
# Network calls happen here, in Rust, never as a webview `fetch()` — so
# they're outside the CSP entirely and go through the same narrow-validated
# -command shape as everything else in this file.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json"] }
scraper = "0.20"
percent-encoding = "2"
# Native OS controls (os.rs): lock, power, media/volume keys, the recycle
# bin. Direct Win32 calls rather than shelling out to powershell, which
# would have handed the renderer a general-purpose command runner.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
# The premium bar for this app is "feels instant". These are the cheap wins:
# one codegen unit and LTO for speed, panic=abort and symbol stripping for size.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
