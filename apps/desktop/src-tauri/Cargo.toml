[package]
name = "atlas-desktop"
version = "1.0.0"
description = "Atlas — a local-first desktop assistant"
authors = ["Atlas"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 2 builds the app as a library so the same entry point serves desktop
# and (later) mobile targets.
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
# The native file picker. Nothing else in this app can choose a file for
# the person, and an <input type="file"> in the webview hands back a
# browser File with no path — which is useless to skills that operate on
# paths. Only the open dialog is granted; see capabilities/default.json.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
walkdir = "2"
# Opening happens in Rust, behind the validated commands in platform.rs, rather
# than through a JS-facing plugin the renderer could call with any target.
open = "5"
# files.delete sends to the OS recycle bin rather than calling fs::remove_*
# directly — meaningfully safer for a confirm-gated destructive action.
trash = "3"
# web_search / fetch_page (web.rs), ask_local_model_stream (intelligence.rs) / cloud_intelligence.rs.
# Network calls happen here, in Rust, never as a webview `fetch()` — so
# they're outside the CSP entirely and go through the same narrow-validated
# -command shape as everything else in this file.
# `stream` — a local model's reply stream (intelligence.rs) is read incrementally via
# `bytes_stream()` rather than buffered whole, so the first token can reach
# the renderer before the model has finished the answer.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "multipart", "stream"] }
# The `Stream` trait `bytes_stream()` returns, plus the buffering combinators
# `consume_sse` (intelligence.rs) uses to reassemble lines split across
# network chunks.
futures-util = "0.3"
# halt.rs: `watch` wakes every in-flight request the instant a halt lands, and
# `select!` drops the losing future — which is what actually closes a model's
# connection mid-answer. Already in the tree via Tauri; this only names it.
tokio = { version = "1", features = ["sync", "macros"] }
scraper = "0.20"
# screen.rs: encodes the raw BGRA buffer GDI hands back into PNG. GDI capture
# is real, bug-prone work the ecosystem already solved correctly; writing a
# PNG encoder by hand for this would be new bugs for no new capability.
# `default-features = false` keeps every codec but PNG out of the binary.
image = { version = "0.25", default-features = false, features = ["png"] }
percent-encoding = "2"
# updater.rs: SHA-256 of a downloaded installer. Already in the tree via Tauri; this only names it.
sha2 = "0.10"
# Kokoro (kokoro.rs) — the refined voice, run in this process rather than
# shelled out to.
#
# `load-dynamic` rather than the default linked build, for the same reason
# whisper's DLLs are vendored rather than linked: the ONNX runtime ships as a
# Tauri resource beside the model, and ort is pointed at it by absolute path at
# startup. Linking it would put the runtime in the binary whether or not the
# voice is installed, and this voice is optional by design.
#
# ⚠️ There is no stable ort release; rc.13 is the head of 2.0. Pinned exactly —
# the release candidates have made breaking API changes between themselves, and
# `inputs!` and `try_extract_array` are among the things that have moved.
#
# No `ndarray` feature, and no ndarray dependency: tensors are built from a
# shape and a `Vec` instead. ort's ndarray conversions are implemented for the
# exact ndarray version *it* depends on, so taking that path would pin this
# crate to ort's transitive choice and break on the release candidate that
# changes it. A shape and a Vec cannot go out of sync with anything.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
# espeak-ng is loaded at runtime out of piper's vendor directory rather than
# linked: the DLL is already shipped there, and building espeak from source
# would add a C toolchain to what this project needs to compile.
libloading = "0.8"
# Native OS controls (os.rs): lock, power, media/volume keys, the recycle
# bin. Direct Win32 calls rather than shelling out to powershell, which
# would have handed the renderer a general-purpose command runner.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Shutdown",
  # SHELLEXECUTEINFOW carries an HKEY, so the per-action elevation in
  # services.rs needs the registry types even though it touches no registry.
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # window.rs: DwmGetWindowAttribute's extended-frame-bounds atom is the true
  # visible outline of a window, unlike GetWindowRect which since Windows 10
  # includes several pixels of invisible resize border on every side.
  "Win32_Graphics_Dwm",
  # uia.rs: UI Automation is a COM API (IUIAutomation and friends). Bound
  # directly against `windows` rather than through a wrapper crate — every
  # other native surface in this codebase (kokoro.rs's ONNX/espeak loading,
  # services.rs's ShellExecuteEx) is hand-written against `windows` the same
  # way, and a second, less-audited crate would only save boilerplate.
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  # screen.rs: GDI bitmap capture (BitBlt/CreateDIBSection/GetDIBits) and
  # display enumeration.
  "Win32_Graphics_Gdi",
  # PrintWindow — despite what it does, Windows' own metadata files it under
  # the print/XPS surface rather than Gdi or WindowsAndMessaging.
  "Win32_Storage_Xps",
  # GetDpiForMonitor, so a captured screen's pixel size matches its reported
  # bounds on a scaled display instead of silently disagreeing with them.
  "Win32_UI_HiDpi",
  # secrets.rs: CredWriteW/CredReadW/CredDeleteW — cloud provider API keys
  # live in Windows Credential Manager, never in storage.json.
  "Win32_Security_Credentials",
  # halt.rs: every supervised tool runs in its own Job Object, so an emergency
  # stop terminates the whole process tree (cmd → pnpm → node), not just the
  # first process in it.
  "Win32_System_JobObjects",
  # halt.rs: Ctrl+C delivered to a tool's own console — the polite request
  # that comes before terminating its job.
  "Win32_System_Console",
  # updater.rs: WinVerifyTrust (is the installer code-signed?) and the installer's
  # own version resource (is it Atlas, and is it the version the manifest says?).
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
# The premium bar for this app is "feels instant". These are the cheap wins:
# one codegen unit and LTO for speed, panic=abort and symbol stripping for size.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
